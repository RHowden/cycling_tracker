# Full stack: browse to http://localhost:8080
# Run: docker compose -f docker-compose.full.yml up --build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cycling_tracker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cycling_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata_full:/var/lib/postgresql/data   # separate from the dev compose volume

  api:
    build: .
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=cycling_tracker;Username=postgres;Password=devpassword"
      RunMigrations: "true"

volumes:
  pgdata_full: